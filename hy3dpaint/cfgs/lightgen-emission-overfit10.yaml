# lightgen: pbr->emission multiview overfit on the 10-shape pilot fixture.
#
# Paths below are absolute/machine-specific by design (no templating). As of Task 8
# (2026-07-30) the active values are venus's (cs-venus-05); the overfit pilot run itself
# happened 2026-08-03, verified there. The local-workstation equivalents are recorded in
# comments for reference when iterating on the RTX 4090 instead.
#
# Run from hy3dpaint/ (relative paths here resolve against that cwd):
#   conda run -n hunyuanpaint bash -c \
#     'PYTHONNOUSERSITE=1 python train.py --base cfgs/lightgen-emission-overfit10.yaml --gpus 0,'

model:
  base_learning_rate: 5.0e-05
  target: hunyuanpaintpbr.model_emission.HunyuanPaintEmission
  params:
    num_view: 6
    view_size: 512
    drop_cond_prob: 0.1
    val_num_inference_steps: 30

    # Required at view_size 512 on a 24 GB card: without it a single 6-view batch-1
    # forward+backward OOMs; with it the measured peak is 17.4 GiB (RTX 4090, bf16).
    # Safe to turn off on 48/80 GB cards.
    #
    # MEASURED 2026-07-30 -- this config does NOT fit a 24 GB RTX 4090 for actual TRAINING,
    # at any view_size. A forward+backward fits (17.4 GiB), but adding AdamW's two moment
    # buffers does not: 972.3M trainable params cost 7.85 GiB (unet fp32) + 3.89 GiB (grads)
    # + 7.78 GiB (AdamW state) + 2.28 GiB (DINOv2-giant bf16) + ~0.85 GiB (VAE + text encoder)
    # = ~22.7 GiB before a single activation. train.py OOMs inside AdamW's exp_avg_sq
    # allocation at both view_size 512 and 256. To train on this box one of these has to
    # change (a training-recipe decision, deliberately not made here): run on a 48/80 GB
    # card; use an 8-bit optimiser; shrink the trainable set below the inherited
    # freeze(attn1, unet_dual) recipe; or hold the unet in bf16.
    #
    # MEASURED 2026-08-03 on cs-venus-05 (RTX Pro 6000 Blackwell Max-Q, 96 GB): actual
    # training peak WITH checkpointing on is 33.0 GiB -- comfortably inside 96 GB. Turning
    # checkpointing off has not been measured on venus; left on since it is not the
    # bottleneck there.
    gradient_checkpointing: true

    # 4 noisy emission + 4 normal + 4 position + 4 albedo + 4 mr.
    # train.py expands conv_in from the pretrained 12 to this, zero-initialising channels 12-19
    # (albedo 12-15, mr 16-19) to match the append order in hunyuanpaintpbr/unet/modules.py.
    noise_in_channels: 20

    stable_diffusion_config:
      # venus (active, staged 2026-07-30 on cs-venus-05, HF_HOME=/localscratch/dya78/lightgen_mvpaint/hf_home):
      pretrained_model_name_or_path: /localscratch/dya78/lightgen_mvpaint/hf_home/hub/models--tencent--Hunyuan3D-2.1/snapshots/0b94677654c57bb9a6b6845cd7b704ccf551d327/hunyuan3d-paintpbr-v2-1
      # local workstation value (RTX 4090), for reference when iterating there instead:
      # local: /localhome/dya78/.cache/huggingface/hub/models--tencent--Hunyuan3D-2.1/snapshots/0b94677654c57bb9a6b6845cd7b704ccf551d327/hunyuan3d-paintpbr-v2-1
      custom_pipeline: ./hunyuanpaintpbr

data:
  target: src.data.objaverse_hunyuan.DataModuleFromConfig
  params:
    batch_size: 1
    num_workers: 4
    train:
      -
        target: src.data.dataloader.lightgen_emission_loader.LightgenEmissionDataset
        params:
          num_view: 6
          json_path: scripts/lightgen/pilot10_venus.json
          # local workstation value, for reference: scripts/lightgen/pilot10_local.json
          # (holds /cs/3dlg-jupiter-project paths that venus cannot see).
    validation:
      -
        target: src.data.dataloader.lightgen_emission_loader.LightgenEmissionDataset
        params:
          num_view: 6
          json_path: scripts/lightgen/pilot10_venus.json
          # local workstation value, for reference: scripts/lightgen/pilot10_local.json

lightning:
  modelcheckpoint:
    params:
      every_n_train_steps: 500
      save_top_k: -1
      save_last: true
  callbacks: {}

  trainer:
    benchmark: true
    max_steps: 3000
    gradient_clip_val: 1.0
    val_check_interval: 250
    num_sanity_val_steps: 0
    check_val_every_n_epoch: null   # if not set, validation does not run
