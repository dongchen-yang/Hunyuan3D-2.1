# lightgen: pbr->emission multiview fine-tune WITH alpha, on a full fir H100 node.
#
# Derived from cfgs/lightgen-emission-74k-alpha.yaml (the venus sibling). The model block is
# byte-for-byte the same idea -- 24-channel conv_in, use_alpha true -- and everything that
# differs is either a path or a consequence of the hardware.
#
# WHY THE RECIPE IS ALLOWED TO CHANGE HERE. The venus alpha config was written to be an
# equal-compute A/B against the 20-channel run. The user dropped that requirement on
# 2026-08-15: what is wanted is ONE good alpha model, not a controlled comparison. So this
# config is sized for the hardware instead of for the old run, and the 20-channel checkpoint
# stays as the published no-alpha row without being re-run.
#
# SIZING. Measured on the Blackwell: 33.0 GiB peak at bs1 with gradient checkpointing, of
# which ~22.7 GiB is static AdamW state -- so ~10.3 GiB marginal per sample. On an 80 GB
# H100: 22.7 + 10.3*4 ~= 64 GiB, leaving 20% headroom. That margin is not padding; fir
# requeues jobs frequently and an OOM on resume wastes a whole segment.
#   bs4 per GPU x 4 GPUs x accumulate 1 = global batch 16 = 96 views/step.
# Twice the venus run's global 8, and it removes the gradient accumulation entirely.
#
# LEARNING RATE -- the one knob here that has never been run. train.py prints
# "NOT USING LR SCALING", so 5e-5 was the literal optimiser LR at global batch 8. Doubling
# the batch without touching it would halve the effective per-epoch step size. 7e-5 is
# sqrt(2) scaling: the conservative choice for a fine-tune, where the pretrained weights are
# the asset we cannot afford to wreck, and where linear scaling (1e-4) has more room to go
# wrong than it has to gain. scripts/lightgen/smoke_fir.sbatch gates on this -- if
# train/emission_loss does not fall over its 60 steps, drop back to the proven 5e-5 rather
# than tuning further.
#
# STEPS. 50,000 at global 16 = 800k shape-visits, ~11 epochs of the 71,645-shape train
# split -- double the venus run, and still short of the other baselines (TEXGen v2 ~4.4M
# visits, emission DiT v2 1.6M).
#
# Two different things both involve the word "chain", so keep them apart:
#
#   * REACHING 50,000 takes ~4 jobs, because each is capped at 24 h. That is not a decision,
#     it is arithmetic; scripts/lightgen/submit_chain_fir.sh queues them with afterany
#     dependencies and one shared LIGHTGEN_RUN_TS. max_steps is global and lives in the
#     checkpoint, so the segments march toward 50,000 together rather than each restarting
#     the count. Nothing in this file changes for that.
#
#   * GOING PAST 50,000 to 100k / 1.6M visits, to match the DiT's budget, is a separate
#     decision that DOES change this file -- raise max_steps here, then queue more segments
#     against the same stamp. Decide it after the first checkpoints are scored, not now.

model:
  base_learning_rate: 7.0e-05
  target: hunyuanpaintpbr.model_emission.HunyuanPaintEmission
  params:
    num_view: 6
    view_size: 512
    drop_cond_prob: 0.1
    val_num_inference_steps: 30
    gradient_checkpointing: true

    # 4 noisy emission + 4 normal + 4 position + 4 albedo + 4 mr + 4 alpha.
    # train.py expands conv_in from the pretrained 12 to this, zero-initialising 12-23 to
    # match the append order in hunyuanpaintpbr/unet/modules.py (_PBR_STACK).
    use_alpha: true
    noise_in_channels: 24

    stable_diffusion_config:
      # Path is deterministic, not copied by hand: scripts/lightgen/stage_fir.sh pins
      # revision 0b94677654c57bb9a6b6845cd7b704ccf551d327 -- the same snapshot the venus env
      # runs -- so HF_HOME/hub/models--<repo>/snapshots/<rev>/ resolves to exactly this.
      # Pinning the revision is what makes fir and venus the same weights rather than
      # "whatever main was on the day each was staged".
      pretrained_model_name_or_path: /scratch/dya78/lightgen_mvpaint/hf_home/hub/models--tencent--Hunyuan3D-2.1/snapshots/0b94677654c57bb9a6b6845cd7b704ccf551d327/hunyuan3d-paintpbr-v2-1
      custom_pipeline: ./hunyuanpaintpbr

data:
  target: src.data.objaverse_hunyuan.DataModuleFromConfig
  params:
    # Per GPU. 4 GPUs x accumulate_grad_batches 1 -> global batch 16.
    batch_size: 4
    # 48 CPUs / 4 DDP ranks = 12 per rank; 10 loader workers leaves 2 for the rank's own
    # process. Each worker now decodes 38 PNGs per example (37 read + the ref copy), up from
    # 31 before alpha, so this is the knob if the GPUs turn out to be starved.
    num_workers: 10
    train:
      -
        target: src.data.dataloader.lightgen_emission_loader.LightgenEmissionDataset
        params:
          num_view: 6
          use_alpha: true
          # Regenerated INSIDE the job by make_74k_jsons.py, because $SLURM_TMPDIR changes
          # every run. Its A7 gate (36 render_tex PNGs per listed dir) is also what proves
          # the tar extract landed whole -- so the JSON build is a data check, not plumbing.
          json_path: /scratch/dya78/lightgen_mvpaint/mv74k_train.json
    validation:
      -
        target: src.data.dataloader.lightgen_emission_loader.LightgenEmissionDataset
        params:
          num_view: 6
          use_alpha: true
          json_path: /scratch/dya78/lightgen_mvpaint/mv74k_val64.json

lightning:
  modelcheckpoint:
    params:
      # 1250, not 2500, because the campaign runs in 24-HOUR segments. Whatever has happened
      # since the last `last.ckpt` write is lost when SLURM kills the job at the wall clock,
      # so the checkpoint interval is a direct tax on every segment boundary: at ~5 s/step,
      # 2500 risks ~3.5 h of a 24 h segment (15%), 1250 risks ~1.7 h (7%).
      every_n_train_steps: 1250
      # save_last is what makes a requeue survivable: the resume path reads last.ckpt from
      # the LIGHTGEN_RUN_TS-stamped logdir. save_top_k selects on sampled-emission quality,
      # a pixel MSE of the fully sampled views vs GT -- not the v-prediction training loss.
      save_top_k: 3
      monitor: 'val/emission_mse'
      mode: min
      save_last: true
  callbacks: {}

  trainer:
    benchmark: true
    max_steps: 50000
    gradient_clip_val: 1.0
    accumulate_grad_batches: 1
    # pytorch-lightning counts val_check_interval in TRAINING BATCHES while max_steps and
    # every_n_train_steps count OPTIMISER STEPS. With accumulate_grad_batches 1 those are
    # the same thing here, unlike the venus config where accumulate 2 made validation run at
    # half the checkpoint interval.
    #
    # KEPT EQUAL TO every_n_train_steps ON PURPOSE. It is tempting to checkpoint often (crash
    # safety) while validating rarely (cost), but that quietly corrupts checkpoint SELECTION:
    # `val/emission_mse` persists in `callback_metrics` between validations, so a checkpoint
    # written at a non-validation step is ranked with the PREVIOUS validation's score and can
    # take a top_k slot it did not earn. (It does not crash --
    # ModelCheckpoint._save_topk_checkpoint only raises MisconfigurationException when the key
    # is absent entirely AND the val loop has already run, which a stale-but-present value
    # avoids. Verified against the installed pytorch_lightning 1.9.5 source.)
    #
    # 1250 gives 40 validations over the 50k-step campaign -- the same number the venus run
    # did, so validation overhead is a known quantity rather than a new variable.
    val_check_interval: 1250
    num_sanity_val_steps: 0
    check_val_every_n_epoch: null   # if not set, validation does not run
    # `devices` is not set here: train.py overwrites it from --gpus (0,1,2,3 -> 4).
