# lightgen: pbr->emission multiview fine-tune WITH the alpha (glTF opacity) condition.
#
# Identical in every respect to cfgs/lightgen-emission-74k.yaml -- same split, same LR, same
# schedule, same batch shape, same 50,000 steps, same pretrained snapshot, fine-tuned from the
# same Hunyuan base rather than continued from the 20-channel run -- except for ONE thing: the
# UNet additionally consumes a per-view alpha map, so conv_in goes 20 -> 24 channels and the
# dataloader emits images_alpha.
#
# WHY: conditioning parity. TEXGen's 13ch variant, TRELLIS.2 (both chains) and SegviGen all
# condition on per-texel glTF opacity; the multiview baseline was the only one that did not,
# because its fixture was rendered against the 7-key atlas contract, before `alpha` became atlas
# key #8 (2026-08-10 -> 08-12). The user's requirement is that every baseline receive the same
# input, so the fixture was upgraded in place by
# data_processing/multiview_render_pipeline/append_alpha_views.py and this config consumes it.
#
# Channel stack (positional -- see hunyuanpaintpbr/unet/modules.py `_PBR_STACK`):
#   noisy 0-3 | normal 4-7 | position 8-11 | albedo 12-15 | mr 16-19 | ALPHA 20-23
# Alpha is APPENDED at the end, not inserted beside mr, so every channel the existing 20-channel
# run learned keeps its meaning and the two runs stay legible as an A/B.
#
# train.py expands the pretrained 12-channel conv_in to `noise_in_channels`, zero-initialising
# everything past 12 -- so 24 needs no code change there, only this number.
#
# The existing no-alpha run (cfgs/lightgen-emission-74k.yaml, ckpt step=00045000, eval row
# `pbr->emission (multiview) _v2`) is deliberately left untouched: it is the record of what
# produced the current table, and it becomes the "without alpha" ablation row, exactly as
# texgen_vanilla_74k_v2 does on the TEXGen side.
#
# Equal-compute A/B: same 50,000 steps at global batch 8 from the same pretrained init. The only
# difference is the extra condition. Launch with scripts/lightgen/train_74k_alpha.sbatch -- do
# not run it by hand without exporting LIGHTGEN_RUN_TS (see train.py's logdir comment).
#
# Paths below are cs-venus-05's, by design (no templating) -- same convention as the pilot and
# the no-alpha config. The train/val example JSONs are generated on the node by
# make_74k_jsons.py, whose structural gate now REQUIRES 36 render_tex PNGs, so it refuses to
# list a shape whose alpha maps have not been staged.

model:
  # Unchanged from the no-alpha run so the A/B differs in the condition set and nothing else.
  # train.py prints "NOT USING LR SCALING", so this is the literal optimiser LR.
  base_learning_rate: 5.0e-05
  target: hunyuanpaintpbr.model_emission.HunyuanPaintEmission
  params:
    num_view: 6
    view_size: 512
    drop_cond_prob: 0.1
    val_num_inference_steps: 30

    # MEASURED 2026-08-03 on cs-venus-05 (RTX Pro 6000 Blackwell Max-Q, 96 GB): 33.0 GiB at
    # batch_size 1 with checkpointing ON, for the 20-channel stack. The alpha condition adds one
    # more VAE encode per sample and 4 conv_in channels -- negligible against 96 GB, but the
    # first-30s log tail check after submission should still confirm the step time and VRAM
    # against the no-alpha run rather than assuming.
    gradient_checkpointing: true

    # 4 noisy emission + 4 normal + 4 position + 4 albedo + 4 mr + 4 alpha.
    # train.py expands conv_in from the pretrained 12 to this, zero-initialising channels 12-23
    # to match the append order in hunyuanpaintpbr/unet/modules.py.
    use_alpha: true
    noise_in_channels: 24

    stable_diffusion_config:
      # venus (staged 2026-07-30 on cs-venus-05, HF_HOME=/localscratch/dya78/lightgen_mvpaint/hf_home):
      pretrained_model_name_or_path: /localscratch/dya78/lightgen_mvpaint/hf_home/hub/models--tencent--Hunyuan3D-2.1/snapshots/0b94677654c57bb9a6b6845cd7b704ccf551d327/hunyuan3d-paintpbr-v2-1
      custom_pipeline: ./hunyuanpaintpbr

data:
  target: src.data.objaverse_hunyuan.DataModuleFromConfig
  params:
    # Per-GPU. Two GPUs x accumulate_grad_batches 2 -> global batch 8.
    batch_size: 2
    # Per DDP rank: 2 ranks x 6 workers = 12 loader processes, inside the sbatch's
    # --cpus-per-task=16 (leaves headroom for the two main processes). Each worker now decodes
    # 37 PNGs per example instead of 31; the alpha maps are near-uniform and cheap to decode, but
    # if the loader turns out to be the bottleneck this is the knob.
    num_workers: 6
    train:
      -
        target: src.data.dataloader.lightgen_emission_loader.LightgenEmissionDataset
        params:
          num_view: 6
          # Conditioning parity: emit the opacity map. Requires a 36-PNG fixture.
          use_alpha: true
          json_path: /localscratch/dya78/lightgen_mvpaint/mv74k_train.json
    validation:
      -
        target: src.data.dataloader.lightgen_emission_loader.LightgenEmissionDataset
        params:
          num_view: 6
          # Conditioning parity: emit the opacity map. Requires a 36-PNG fixture.
          use_alpha: true
          json_path: /localscratch/dya78/lightgen_mvpaint/mv74k_val64.json

lightning:
  modelcheckpoint:
    params:
      every_n_train_steps: 2500
      # The metric is logged in validation_step (model_emission.py) and is a *pixel* MSE of the
      # fully sampled views vs GT -- not the v-prediction training loss.
      save_top_k: 3
      monitor: 'val/emission_mse'
      mode: min
      save_last: true
  callbacks: {}

  trainer:
    benchmark: true
    max_steps: 50000
    gradient_clip_val: 1.0
    accumulate_grad_batches: 2
    # pytorch-lightning counts val_check_interval in *training batches* while max_steps and
    # every_n_train_steps count *optimiser steps* -- with accumulate_grad_batches 2 this means
    # validation runs every 1,250 optimiser steps, i.e. 40 times over the run. Kept identical to
    # the no-alpha config so checkpoint selection is comparable between the two.
    val_check_interval: 2500
    num_sanity_val_steps: 0
    check_val_every_n_epoch: null   # if not set, validation does not run
    # `devices` is not set here: train.py overwrites it from --gpus (0,1 -> 2).
