# Hunyuan3D-Paint for emission on LightGenBench (Hugging Face 3dlg-hcvc/LightgenBench: train 36,426,
# val 200, test 200): 24-channel conv_in, the TexVerse thumbnail as reference, 4 GPUs x batch 4 =
# global batch 16, LR 7e-5, 50,000 steps. The learning rate restarts every 10,000 steps (1,000
# warm-up + 9,000 cosine, HunyuanPaint.configure_optimizers) and a checkpoint is kept at each
# restart; choose among them on the validation split.
# train.py logs to Weights & Biases: log in, or set WANDB_MODE=offline.
#
# A template: scripts/lightgenbench/unpack_hf_dataset.sh writes <data_dir>/hunyuan-paint-emission.yaml
# with the tokens filled (train.py names the logdir after the file name):
#   __SNAPSHOT__     the Hunyuan3D-2.1 hunyuan3d-paintpbr-v2-1/ directory, revision 0b94677654c57bb9a6b6845cd7b704ccf551d327
#   __DATA_DIR__     the data directory
#   __NUM_WORKERS__  data loader workers per GPU

model:
  base_learning_rate: 7.0e-05
  target: hunyuanpaintpbr.unet.model.HunyuanPaint
  params:
    num_view: 6
    view_size: 512
    drop_cond_prob: 0.1
    val_num_inference_steps: 30
    gradient_checkpointing: true

    # 4 noisy emission + 4 normal + 4 position + 4 albedo + 4 mr + 4 alpha; train.py widens the
    # pretrained 12 channels with zeros.
    use_alpha: true
    noise_in_channels: 24

    stable_diffusion_config:
      pretrained_model_name_or_path: __SNAPSHOT__
      custom_pipeline: ./hunyuanpaintpbr

data:
  target: src.data.objaverse_hunyuan.DataModuleFromConfig
  params:
    # Per GPU.
    batch_size: 4
    num_workers: __NUM_WORKERS__
    train:
      -
        target: src.data.dataloader.objaverse_loader_forTexturePBR.TextureDataset
        params:
          num_view: 6
          use_alpha: true
          # The thumbnail, augmented with upstream's augment_image; a missing one is a bad example.
          ref_source: thumbnail
          thumbnail_dir: __DATA_DIR__/thumbs
          augment_ref: true
          json_path: __DATA_DIR__/release_train.json
    validation:
      -
        target: src.data.dataloader.objaverse_loader_forTexturePBR.TextureDataset
        params:
          num_view: 6
          use_alpha: true
          ref_source: thumbnail
          thumbnail_dir: __DATA_DIR__/thumbs
          augment_ref: false
          json_path: __DATA_DIR__/release_val64.json

lightning:
  modelcheckpoint:
    params:
      every_n_train_steps: 1250
      save_top_k: 3
      monitor: 'val/emission_mse'
      mode: min
      save_last: true
  # Every checkpoint at the learning-rate restarts, kept: choose among these, since
  # val/emission_mse is too noisy to select on.
  trough_checkpoint:
    every_n_train_steps: 10000
  callbacks: {}

  trainer:
    benchmark: true
    max_steps: 50000
    gradient_clip_val: 1.0
    accumulate_grad_batches: 1
    # The checkpoint at a step is saved before that step's validation, so it carries the previous
    # validation's val/emission_mse.
    val_check_interval: 1250
    num_sanity_val_steps: 0
    check_val_every_n_epoch: null   # if not set, validation does not run
    # `devices` is not set here: train.py overwrites it from --gpus (0,1,2,3 -> 4).
