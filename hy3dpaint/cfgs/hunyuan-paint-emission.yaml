# lightgen: pbr->emission multiview fine-tune WITH alpha, REFERENCE IMAGE = the TexVerse
# thumbnail, on the RELEASED dataset (Hugging Face 3dlg-hcvc/LightgenBench: train 36,426 /
# val 200 / test 200). The paper recipe on the new data: `model:` and `lightning:` below equal,
# apart from the snapshot path, those of cfgs/lightgen-emission-74k-alpha-thumb-agentic-fir-xg.yaml,
# the paper run's config (24-channel conv_in, LR 7e-5, bs4 x 4 GPUs = global 16, 50,000 steps,
# checkpoint/validation every 1,250, trough checkpoints every 10,000); the reasoning is in that file
# and in its -fir and venus-05 twins (tag pre-refactor).
# 50,000 x 16 = 800k shape-visits = ~22 epochs of 36,426. The learning rate restarts every
# 10,000 steps (1,000 warm-up + 9,000 cosine; HunyuanPaint.configure_optimizers), and a checkpoint
# is kept at each restart; the release run's scored checkpoint, 40,000, was chosen on the
# validation split. train.py logs to Weights & Biases: log in, or set WANDB_MODE=offline.
#
# THIS FILE IS A TEMPLATE: it carries tokens instead of absolute paths, and two scripts write the
# config that trains from it, under the same basename. On one machine,
# scripts/lightgenbench/unpack_hf_dataset.sh writes <data_dir>/hunyuan-paint-emission.yaml
# with the snapshot, the data dir for __DATA_DIR__ and the workers. On an Alliance cluster, the job
# body (scripts/internal/train_release_body.sh) writes the config into node-local storage each
# segment:
#   __SNAPSHOT__  the pinned Hunyuan3D-2.1 snapshot's hunyuan3d-paintpbr-v2-1/ directory
#   __DATA_DIR__  $SLURM_TMPDIR/lightgen_release: the unpacked release, re-laid-out to the
#              fixture layout the loader reads (scripts/lightgenbench/relayout_release.py), the
#              thumbnail dir and the two example JSONs. Nothing shared between segments, so
#              there is no symlink to repoint and no JSON to overwrite under a running job.
# The body also sets num_workers from the job's CPUs (cpus/4 - 2; 10 on a 48-CPU node, the
# paper value). train.py names the logdir after this file's basename, so the generated copy
# keeps it.
#
# Launcher: scripts/internal/submit_release.sh (login node; cluster-aware header + the body).
# Validation during training is val64 of the NEW val split
# (scripts/lightgenbench/val64_release_shas.txt, the make_val_subset.py rule on the 200); only 28
# of the old val64 are in the new val split.

model:
  base_learning_rate: 7.0e-05
  target: hunyuanpaintpbr.unet.model.HunyuanPaint
  params:
    num_view: 6
    view_size: 512
    drop_cond_prob: 0.1
    val_num_inference_steps: 30
    gradient_checkpointing: true

    # 4 noisy emission + 4 normal + 4 position + 4 albedo + 4 mr + 4 alpha.
    # train.py expands conv_in from the pretrained 12 to this, zero-initialising 12-23 to
    # match the append order in hunyuanpaintpbr/unet/modules.py (_PBR_STACK).
    use_alpha: true
    noise_in_channels: 24

    stable_diffusion_config:
      # Path is deterministic, not copied by hand: scripts/internal/stage_alliance.sh pins
      # revision 0b94677654c57bb9a6b6845cd7b704ccf551d327 -- the same snapshot the venus env
      # runs -- so HF_HOME/hub/models--<repo>/snapshots/<rev>/ resolves to exactly this.
      # Pinning the revision is what makes fir and venus the same weights rather than
      # "whatever main was on the day each was staged".
      pretrained_model_name_or_path: __SNAPSHOT__
      custom_pipeline: ./hunyuanpaintpbr

data:
  target: src.data.objaverse_hunyuan.DataModuleFromConfig
  params:
    # Per GPU. 4 GPUs x accumulate_grad_batches 1 -> global batch 16.
    batch_size: 4
    # Filled by the job body: CPUs / 4 DDP ranks - 2 for the rank's own process (48 CPUs ->
    # 10, the paper value). Each worker decodes 37 PNGs per example plus the thumbnail (and
    # augments it).
    num_workers: __NUM_WORKERS__
    train:
      -
        target: src.data.dataloader.objaverse_loader_forTexturePBR.TextureDataset
        params:
          num_view: 6
          use_alpha: true
          # Reference = TexVerse thumbnail <thumbnail_dir>/<sha>.png via upstream load_image,
          # then upstream augment_image (identity p=0.5; rotation/scale/translation/
          # perspective; fill = the drawn gray/black/white background). The release ships the
          # thumbnail as <uuid>/thumbnail.png; relayout_release.py hard-links each one to
          # __DATA_DIR__/thumbs/<uuid>.png, and make_example_lists.py --thumbnail_dir proves every
          # listed sha has one before a batch is touched. No fallback: a missing thumbnail is
          # a bad example, fatal after three distinct ones.
          ref_source: thumbnail
          thumbnail_dir: __DATA_DIR__/thumbs
          augment_ref: true
          # Written INSIDE the job by make_example_lists.py with the ABSOLUTE node-local paths of
          # THIS job, from the train list of the release's splits.json (36,426;
          # --expect_train 36426, NO --allow_missing) with --thumbnail_dir; A7 is the proof
          # the views and the thumbnails are both staged whole.
          json_path: __DATA_DIR__/release_train.json
    validation:
      -
        target: src.data.dataloader.objaverse_loader_forTexturePBR.TextureDataset
        params:
          num_view: 6
          use_alpha: true
          # Same reference source, NO augmentation: val/emission_mse must compare checkpoints
          # on identical inputs.
          ref_source: thumbnail
          thumbnail_dir: __DATA_DIR__/thumbs
          augment_ref: false
          json_path: __DATA_DIR__/release_val64.json

lightning:
  modelcheckpoint:
    params:
      # 1250, not 2500, because the campaign runs in 24-HOUR segments. Whatever has happened
      # since the last `last.ckpt` write is lost when SLURM kills the job at the wall clock,
      # so the checkpoint interval is a direct tax on every segment boundary. At the MEASURED
      # 3.80 s/step, 2500 would risk 2.6 h of a 24 h segment (11%); 1250 risks 1.3 h (5.5%).
      every_n_train_steps: 1250
      # save_last is what makes a requeue survivable: the resume path reads last.ckpt from
      # the LIGHTGEN_RUN_TS-stamped logdir. save_top_k selects on sampled-emission quality,
      # a pixel MSE of the fully sampled views vs GT -- not the v-prediction training loss.
      save_top_k: 3
      monitor: 'val/emission_mse'
      mode: min
      save_last: true
  # Unconditional saves at the LR-cycle troughs (warm_up_step 1000 + T_step 9000 = a
  # 10,000-step cycle, see configure_optimizers). The main callback above cannot be relied on
  # for these: with save_top_k=3 + a monitor, a step that would not enter the top-k is never
  # WRITTEN, so trough 20,000 of this campaign never existed on disk and no watcher could
  # have saved it. These are the checkpoints the real point-sampled evaluator will choose
  # between, because val/emission_mse is too noisy to select on.
  trough_checkpoint:
    every_n_train_steps: 10000
  callbacks: {}

  trainer:
    benchmark: true
    max_steps: 50000
    gradient_clip_val: 1.0
    accumulate_grad_batches: 1
    # pytorch-lightning counts val_check_interval in TRAINING BATCHES while max_steps and
    # every_n_train_steps count OPTIMISER STEPS. With accumulate_grad_batches 1 those are
    # the same thing here, unlike the venus config where accumulate 2 made validation run at
    # half the checkpoint interval.
    #
    # Equal to every_n_train_steps, which ranks each checkpoint by the PREVIOUS validation:
    # ModelCheckpoint saves in on_train_batch_end, and the validation of the same step runs after
    # it (pytorch_lightning 1.9.5, training_epoch_loop.py), so the checkpoint at step N carries
    # `val/emission_mse` from step N - 1250 (the first, at 1250, has none and is not ranked;
    # num_sanity_val_steps is 0). The paper and release runs trained so; the trough
    # checkpoints, not the top 3, are the ones to choose from (above), and val/emission_mse is too
    # noisy to choose on anyway. Validating at half the checkpoint interval would rank each
    # checkpoint by a validation half an interval old.
    #
    # 1250 gives 40 validations over the 50k-step campaign -- the same number the venus run
    # did, so validation overhead is a known quantity rather than a new variable.
    val_check_interval: 1250
    num_sanity_val_steps: 0
    check_val_every_n_epoch: null   # if not set, validation does not run
    # `devices` is not set here: train.py overwrites it from --gpus (0,1,2,3 -> 4).
