# Hunyuan3D-Paint for emission: the configuration of the paper's run. Its model, data and training
# values are those of hunyuan-paint-emission.yaml (24-channel conv_in with alpha, the TexVerse
# thumbnail as reference, 4 GPUs x batch 4 = global batch 16, LR 7e-5, 50,000 steps), with 10 data
# loader workers per GPU. Its paths are the tokens of that template:
#   __SNAPSHOT__     the Hunyuan3D-2.1 hunyuan3d-paintpbr-v2-1/ directory, revision 0b94677654c57bb9a6b6845cd7b704ccf551d327
#   __DATA_DIR__     the data directory
# predict_emission_views.py reads only the model block and the reference source from it; pass
# --snapshot for the weights.

model:
  base_learning_rate: 7.0e-05
  target: hunyuanpaintpbr.unet.model.HunyuanPaint
  params:
    num_view: 6
    view_size: 512
    drop_cond_prob: 0.1
    val_num_inference_steps: 30
    gradient_checkpointing: true

    # 4 noisy emission + 4 normal + 4 position + 4 albedo + 4 mr + 4 alpha.
    # train.py expands conv_in from the pretrained 12 to this, zero-initializing 12-23 to
    # match the append order in hunyuanpaintpbr/unet/modules.py (_PBR_STACK).
    use_alpha: true
    noise_in_channels: 24

    stable_diffusion_config:
      pretrained_model_name_or_path: __SNAPSHOT__
      custom_pipeline: ./hunyuanpaintpbr

data:
  target: src.data.objaverse_hunyuan.DataModuleFromConfig
  params:
    # Per GPU. 4 GPUs x accumulate_grad_batches 1 -> global batch 16.
    batch_size: 4
    # Each worker decodes 36 PNGs per example plus the thumbnail (and augments it).
    num_workers: 10
    train:
      -
        target: src.data.dataloader.objaverse_loader_forTexturePBR.TextureDataset
        params:
          num_view: 6
          use_alpha: true
          # Reference = TexVerse thumbnail <thumbnail_dir>/<uuid>.png via upstream load_image,
          # then upstream augment_image (identity p=0.5; rotation/scale/translation/
          # perspective; fill = the drawn gray/black/white background). No fallback: a missing
          # thumbnail is a bad example, fatal after three distinct ones.
          ref_source: thumbnail
          thumbnail_dir: __DATA_DIR__/thumbs
          augment_ref: true
          json_path: __DATA_DIR__/release_train.json
    validation:
      -
        target: src.data.dataloader.objaverse_loader_forTexturePBR.TextureDataset
        params:
          num_view: 6
          use_alpha: true
          # Same reference source, no augmentation: val/emission_mse compares checkpoints on
          # identical inputs.
          ref_source: thumbnail
          thumbnail_dir: __DATA_DIR__/thumbs
          augment_ref: false
          json_path: __DATA_DIR__/release_val64.json

lightning:
  modelcheckpoint:
    params:
      every_n_train_steps: 1250
      # save_last lets the same command resume from last.ckpt. save_top_k selects on
      # sampled-emission quality, a pixel MSE of the fully sampled views against GT, not the
      # v-prediction training loss.
      save_top_k: 3
      monitor: 'val/emission_mse'
      mode: min
      save_last: true
  # Unconditional saves at the learning-rate restarts (warm_up_step 1000 + T_step 9000 = a
  # 10,000-step cycle, see configure_optimizers). The main callback above never writes a step
  # that would not enter its top-k, and val/emission_mse is too noisy to select on: choose
  # among these on the validation split.
  trough_checkpoint:
    every_n_train_steps: 10000
  callbacks: {}

  trainer:
    benchmark: true
    max_steps: 50000
    gradient_clip_val: 1.0
    accumulate_grad_batches: 1
    # pytorch-lightning counts val_check_interval in training batches while max_steps and
    # every_n_train_steps count optimizer steps. With accumulate_grad_batches 1 those are
    # the same thing here.
    #
    # Kept equal to every_n_train_steps: `val/emission_mse` persists in `callback_metrics`
    # between validations, so a checkpoint written at a non-validation step is ranked with the
    # previous validation's score and can take a top_k slot it did not earn.
    val_check_interval: 1250
    num_sanity_val_steps: 0
    check_val_every_n_epoch: null   # if not set, validation does not run
    # `devices` is not set here: train.py overwrites it from --gpus (0,1,2,3 -> 4).
