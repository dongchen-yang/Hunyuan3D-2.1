# The training check's config (REFACTOR_TODO.md step 2): the release run's config
# (cfgs/lightgen-emission-release-alpha-thumb.yaml at tag pre-refactor) with the check root's shapes,
# batch 1, validation every 16 steps on 2 shapes, one save per checkpointer at the end, and
# trainer.benchmark off. train-check.sh fills the __TOKENS__. `model:` is the release run's.
model:
  base_learning_rate: 7.0e-05
  target: hunyuanpaintpbr.model_emission.HunyuanPaintEmission
  params:
    num_view: 6
    view_size: 512
    drop_cond_prob: 0.1
    val_num_inference_steps: 30
    gradient_checkpointing: true
    use_alpha: true
    noise_in_channels: 24
    stable_diffusion_config:
      pretrained_model_name_or_path: __SNAPSHOT__
      custom_pipeline: ./hunyuanpaintpbr
data:
  target: src.data.objaverse_hunyuan.DataModuleFromConfig
  params:
    batch_size: 1
    num_workers: 1
    train:
      -
        target: src.data.dataloader.lightgen_emission_loader.LightgenEmissionDataset
        params:
          num_view: 6
          use_alpha: true
          ref_source: thumbnail
          thumbnail_dir: __THUMBS__
          augment_ref: true
          json_path: __TRAIN_JSON__
    validation:
      -
        target: src.data.dataloader.lightgen_emission_loader.LightgenEmissionDataset
        params:
          num_view: 6
          use_alpha: true
          ref_source: thumbnail
          thumbnail_dir: __THUMBS__
          augment_ref: false
          json_path: __VAL_JSON__
lightning:
  modelcheckpoint:
    params:
      every_n_train_steps: __SAVE_EVERY__
      save_top_k: 1
      monitor: 'val/emission_mse'
      mode: min
      save_last: false
  trough_checkpoint:
    every_n_train_steps: __SAVE_EVERY__
  callbacks: {}
  trainer:
    benchmark: false
    max_steps: __MAX_STEPS__
    gradient_clip_val: 1.0
    accumulate_grad_batches: 1
    val_check_interval: 16
    num_sanity_val_steps: 0
    check_val_every_n_epoch: null
